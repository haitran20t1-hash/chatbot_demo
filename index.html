<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Chatbot Tuyển Dụng</title>

    <script src="https://www.gstatic.com/dialogflow-console/fast/messenger/bootstrap.js?v=1">\</script>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .title {
            text-align: center;
            margin-top: 30px;
            font-size: 32px;
            font-weight: bold;
            color: #1976d2;
        }

        .subtitle {
            text-align: center;
            margin-top: 10px;
            color: #666;
        }

        df-messenger {
            --df-messenger-button-titlebar-color: #1976d2;
            --df-messenger-chat-background-color: #ffffff;
            --df-messenger-font-color: #000000;
            --df-messenger-send-icon: #1976d2;
        }
    </style>
</head>

<body>

    <div class="title">
        CHATBOT TUYỂN DỤNG
    </div>

    <div class="subtitle">
        Hệ thống hỗ trợ tư vấn và giải đáp thông tin tuyển dụng
    </div>

    <df-messenger
        intent="WELCOME"
        chat-title="Chatbot Tuyển Dụng"
        agent-id="aabc76c0-a304-49c9-a352-d020d7f90b27"
        language-code="vi">
    </df-messenger>

</body>

</html>
